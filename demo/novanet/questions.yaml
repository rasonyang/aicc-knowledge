  - id: q-en-001
    language: EN
    text: "How much data does Plan 59 Plus have?"
    category: COVERED
    tags: [near_duplicate, needs_fact_table]
    liveExample: true
    factLookup: {table: plans, key: {plan: "Plan 59 Plus"}}
    expect:
      - file: en/faq/plan-faq.docx
        section: "Plan FAQ > How much data does Plan 59 Plus include?"
        fact: "60 GB"
      - file: en/plans/plan-59-plus-sheet.docx
        section: "Plan 59 Plus plan sheet > Included allowances"
        fact: "60 GB of data"
    note: "Plan 59 and Plan 59 Plus differ by one word; the answer must be 60 GB, not 30 GB."

