# SPDX-License-Identifier: Apache-2.0
#
# NovaNet question set. Every question is something a caller could say, with the
# source section that answers it. The format is documented in README.md and
# enforced by TestQuestions in demo/novanet/gen.
#
# expect: the sections that answer the question. Any one of them is a correct
#   hit. An empty list means the right answer is NO_MATCH.
#   file     object key of the source, relative to the corpus root
#   section  docx: the heading path joined with " > ", as in the source_ref
#            xlsx content: the range, e.g. "Halls!A2:C16"
#            Q&A workbook: the row, e.g. "Quick answers!A5"
#            source_ref = file + "#" + section (+ "#" + ordinal for a docx)
#   fact     text that occurs verbatim in the section and that a correct
#            answer must state; it tells the right candidate apart when
#            several come from one section
# avoid: sections that look like an answer but are wrong (the replaced policy
#   version, a stale Q&A row, an expired promotion).
# factLookup: the fact table that also answers the question (see facts/).

questions:
