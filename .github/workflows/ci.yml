# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  pull_request:
    paths: ['**', '!**/*.md']
  push:
    branches: [main]
    paths: ['**', '!**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # The tests run against a real PostgreSQL and a real Meilisearch, never
    # mocks. The versions match compose.yaml. Without these services the
    # database and search tests would be skipped silently, so the job sets the
    # KB_TEST_* variables and the services are not optional.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: kb, POSTGRES_PASSWORD: kb, POSTGRES_DB: kb }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.54.3
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-master-key-0123456789
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KB_TEST_DATABASE_URL: postgres://kb:kb@127.0.0.1:5432/kb?sslmode=disable
      KB_TEST_MEILI_URL: http://127.0.0.1:7700
      KB_TEST_MEILI_API_KEY: ci-master-key-0123456789
      KB_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      KB_TEST_S3_ACCESS_KEY_ID: dev
      KB_TEST_S3_SECRET_ACCESS_KEY: dev-secret
      KB_TEST_S3_BUCKET: aicc-knowledge
      KB_TEST_TEI_URL: http://127.0.0.1:8088
      # Keep in step with compose.yaml. The cache key carries both, so a new
      # TEI version or model starts from a clean download.
      TEI_IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
      TEI_MODEL: BAAI/bge-m3
    steps:
      # TEI (CPU) serves the real embedder, so the publish, search, embed and
      # eval tests run instead of skipping. It is started first so the model
      # download and load overlap the checkout, module download and build. A
      # service container cannot take arguments, so it is started here, with
      # the flags of compose.yaml. It uses about 6 GiB of the runner's 16 GiB.
      # The ~2.2 GB of weights are cached (the repository cache limit is 10 GB).
      - name: Restore the TEI model cache
        id: tei-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/tei-data
          key: tei-${{ env.TEI_IMAGE }}-${{ env.TEI_MODEL }}
      - name: Start TEI
        run: |
          mkdir -p ~/tei-data
          docker run -d --name tei -p 127.0.0.1:8088:80 -v "$HOME/tei-data:/data" \
            "$TEI_IMAGE" --model-id "$TEI_MODEL" --max-batch-tokens 4096
      # SeaweedFS is the S3 the scan tests run against. A service container
      # cannot take a command, and `weed mini` is a command, so it is started
      # here, the same image and flags as compose.yaml. Without identities it
      # accepts any access key, as in the dev stack.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 chrislusf/seaweedfs:4.42 \
            mini -dir=/data -bucket=aicc-knowledge
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/aicc-knowledge/ | grep -q '^200$'; then
              echo "SeaweedFS S3 ready"; exit 0
            fi
            sleep 2
          done
          docker logs seaweedfs
          echo "SeaweedFS did not become ready"; exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal docs)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: sqlc output is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          make sqlc-check
      - name: THIRD_PARTY_LICENSES is current
        run: make licenses-check
      # Wait here, after the build and the checks, so they overlap the
      # download. Poll /info, which only reports the loaded model; /health runs an
      # inference (see internal/httpapi/ops.go). A cold start downloads the
      # model, so the wait is generous: up to 15 minutes.
      - name: Wait for TEI
        run: |
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null "$KB_TEST_TEI_URL/info"; then
              echo "TEI ready after $((i * 5))s"; exit 0
            fi
            if [ -z "$(docker ps -q -f name=^tei$)" ]; then break; fi
            sleep 5
          done
          docker logs tei
          echo "TEI did not become ready"; exit 1
      - name: Make the TEI model cache readable
        if: steps.tei-cache.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX ~/tei-data
      - name: Save the TEI model cache
        if: steps.tei-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/tei-data
          key: tei-${{ env.TEI_IMAGE }}-${{ env.TEI_MODEL }}
      # Runs the whole suite with -race and fails on any skipped test that is
      # not in .ci-allowed-skips.txt. Only the tests that need a live LLM are
      # allowed to skip.
      - name: Test
        run: scripts/test-gate.sh
